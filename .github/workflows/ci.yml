name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format (black) and lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: black --check --diff .
      - run: ruff check --output-format github .

  test:
    name: Tests (pytest) and the notebooks with the committed models
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
      # the trained models are committed: on a fresh clone every model must be found and skipped,
      # which also checks that the paths saved on Windows work on Linux
      - run: jupyter nbconvert --to notebook --execute --stdout notebooks/*.ipynb > run.txt
      - run: test "$(grep -c '\] nothing changed' run.txt)" -eq 14
