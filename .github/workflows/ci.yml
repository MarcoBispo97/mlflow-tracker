name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Format (black) and lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: black --check --diff .
      - run: ruff check --output-format github .

  titanic:
    name: Run the Titanic example
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 1st run trains and saves the 5 models; 2nd run must skip all of them
      - run: python titanic.py
      - run: python titanic.py | tee second_run.txt
      - run: test "$(grep -c 'nothing changed' second_run.txt)" -eq 5
